name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evonymasters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: evonymasters/package-lock.json
      - run: npm install
      - run: npm run validate:data
      - run: npm test
      - run: npm run check
      - run: npm run build
