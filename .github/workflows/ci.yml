name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evonymasters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run validate:data
      - run: npm test
      - run: npm run build
      - name: Diagnose public Chest Finder API
        run: |
          node --input-type=module - <<'JS'
          const base='https://evonymasters-sheet-sync.jaynmegepicadventure.workers.dev';
          for(const route of ['/health','/v4/chests?q=Lumber&page=0','/v4/chests?q=Lumber&page=1']){
            try{
              const res=await fetch(base+route,{signal:AbortSignal.timeout(15000),headers:{Origin:'https://www.evonymasters.com'}});
              const text=(await res.text()).slice(0,350);
              console.log(route,'status:',res.status,'cors:',res.headers.get('access-control-allow-origin'),'body:',text);
            }catch(error){console.log(route,'FETCH ERROR:',String(error));}
          }
          JS

      - name: Diagnose live Chest Finder in headless browser
        run: |
          if command -v google-chrome >/dev/null; then
            google-chrome --version
            timeout 45s google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=12000 --dump-dom 'https://www.evonymasters.com/chests/?q=Lumber' > /tmp/chest-dom.txt 2>/tmp/chrome-errors.txt || true
            echo '--- Chest Finder visible status ---'
            grep -oE 'Chest data service is unavailable[^<]*|Chest Finder is temporarily unavailable[^<]*|[0-9]+ matching chests|Finding your best matches[^<]*|Some reward amounts could not be verified[^<]*' /tmp/chest-dom.txt | tail -20 || true
            echo '--- Actual rendered status and count ---'
            python3 - <<'PY'
            from html.parser import HTMLParser
            class Extract(HTMLParser):
                def __init__(self): super().__init__(); self.stack=[]; self.values={}
                def handle_starttag(self,tag,attrs):
                    attrs=dict(attrs); self.stack.append((tag,attrs.get('id')))
                def handle_endtag(self,tag):
                    if self.stack: self.stack.pop()
                def handle_data(self,data):
                    for tag,key in self.stack:
                        if key in ('count','status'):
                            self.values[key]=self.values.get(key,'')+data.strip()
                            break
            p=Extract();p.feed(open('/tmp/chest-dom.txt').read());print(p.values)
            PY
            echo '--- Browser console errors ---'
            grep -Ei 'console|uncaught|failed to load|error' /tmp/chrome-errors.txt | tail -18 || true
          else echo 'Chrome not installed on runner'; fi
